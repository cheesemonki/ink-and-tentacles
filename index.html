<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨水与触手 · 深海牌局</title>
<style>
:root{
  --deep:#0b1d19; --deep2:#0e241f; --deep3:#14302a;
  --mid:#31534b; --mid2:#3f6b60; --line:#567158;
  --mint:#a7f3d0; --teal:#5eead4; --teal2:#6ee7b7; --pale:#ccfbf1;
  --cream:#fefef8; --pink:#ffb4dc; --lav:#dcb4ff; --cyan:#78dcff;
  --purple:#9a84e6; --gold:#fef08a; --coral:#ff8b7b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1b4238 0%, transparent 60%),
    radial-gradient(800px 500px at 90% 100%, #10312b 0%, transparent 55%),
    linear-gradient(180deg,#0b1d19,#0a1a17 60%,#081614);
  color:var(--pale);min-height:100vh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(167,243,208,.13) 1px,transparent 1px);
  background-size:26px 26px;opacity:.5;
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 16px 30px}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(20,48,42,.82);border:1.5px solid var(--line);
  backdrop-filter:blur(10px);
  border-radius:16px;padding:9px 14px;margin-bottom:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.28);
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(11,29,25,.72);border:1.5px solid var(--mid);
  color:var(--mint);border-radius:999px;padding:5px 13px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.pill b{color:var(--cream)}
.relics{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.relic{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:rgba(94,234,212,.13);border:1.5px solid var(--teal);
  font-size:16px;cursor:help;position:relative;transition:.15s;
}
.relic:hover{baskground:rgba(94,234,212,.28);transform:translateY(-2px)}
.relic:hover::after{
  content:attr(data-tip);position:absolute;top:40px;right:0;width:210px;
  background:#0b1d19;border:1.5px solid var(--teal);color:var(--pale);
  padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.45;
  z-index:99;white-space:normal;font-weight:600;
}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:800;
  border-radius:999px;padding:9px 18px;font-size:14px;
  background:linear-gradient(180deg,var(--teal2),var(--teal));
  color:#0b1d19;transition:transform .12s,filter .12s;
  box-shadow:0 4px 14px rgba(94,234,212,.24);
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mint);box-shadow:none}
.btn.pink{background:linear-gradient(180deg,#ffc6e3,var(--pink));color:#3d1130;box-shadow:0 4px 14px rgba(255,180,220,.25)}
.btn.gold{background:linear-gradient(180deg,#fff7b8,var(--gold));color:#3a2f00;box-shadow:0 4px 14px rgba(254,240,138,.25)}
.btn.sm{padding:6px 12px;font-size:12.5px}

/* ---------- 标题页 ---------- */
.hero{
  text-align:center;padding:34px 22px 30px;
  background:linear-gradient(180deg,rgba(20,48,42,.9),rgba(11,29,25,.92));
  border:1.5px solid var(--line);border-radius:26px;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
}
.hero h1{
  margin:14px 0 6px;font-size:clamp(24px,4.6vw,40px);letter-spacing:1px;
  background:linear-gradient(180deg,#fff,#a7f3d0 70%,#5eead4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .sub{color:#8fbfae;font-size:13px;letter-spacing:2px;margin-bottom:16px}
.hero p{color:#b9d9cf;line-height:1.85;font-size:14.5px;max-width:620px;margin:0 auto 8px}
.hero .art{
  width:132px;height:132px;margin:0 auto;border-radius:50%;overflow:hidden;
  border:3px solid var(--teal);box-shadow:0 0 0 8px rgba(94,234,212,.09),0 10px 30px rgba(0,0,0,.4);
}
.hero .art img{width:100%;height:100%;object-fit:cover;display:block}
.tagrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
.tagrow span{font-size:12px;padding:4px 11px;border-radius:999px;background:rgba(94,234,212,.1);
  border:1px solid rgba(94,234,212,.3);color:var(--mint)}
.cta{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn{font-size:16px;padding:13px 34px}

/* ---------- 地图 ---------- */
.mapbox{
  background:rgba(14,36,31,.85);border:1.5px solid var(--line);border-radius:22px;
  padding:20px 18px;box-shadow:0 14px 40px rgba(0,0,0,.32);
}
.mapbox h2{margin:0 0 4px;font-size:19px;color:var(--cream)}
.mapbox .hint{color:#8fbfae;font-size:13px;margin:0 0 18px}
.track{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.node{
  flex:1 0 108px;min-width:108px;border-radius:16px;padding:12px 8px;
  background:rgba(11,29,25,.6);border:1.5px solid #2b4a42;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:.42;transition:.18s;position:relative;
}
.node .ico{font-size:24px;line-height:1}
.node .lbl{font-size:11.5px;font-weight:800;color:var(--pale);text-align:center;line-height:1.25}
.node.done{opacity:.8;border-color:var(--mid2);background:rgba(49,83,75,.5)}
.node.done .lbl::after{content:" ✓";color:var(--teal)}
.node.current{
  opacity:1;border-color:var(--teal);background:linear-gradient(180deg,rgba(94,234,212,.2),rgba(11,29,25,.8));
  box-shadow:0 0 0 3px rgba(94,234,212,.14),0 10px 24px rgba(94,234,212,.12);
  transform:translateY(-3px);cursor:pointer;
}
.node.current:hover{box-shadow:0 0 0 4px rgba(94,234,212,.25),0 12px 28px rgba(94,234,212,.2)}
.node.current .lbl{color:var(--cream)}
.mapfoot{display:flex;justify-content:center;margin-top:8px}

/* ---------- 战斗 ---------- */
.arena{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;
  background:linear-gradient(180deg,rgba(20,48,42,.72),rgba(11,29,25,.9));
  border:1.5px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.32);margin-bottom:12px;position:relative;
}
.arena::after{
  content:"";position:absolute;left:50%;top:14%;bottom:14%;width:1px;
  background:linear-gradient(180deg,transparent,rgba(86,113,88,.6),transparent);
}
.fighter{display:flex;flex-direction:column;align-items:center;gap:9px}
.portrait{
  width:132px;height:132px;border-radius:22px;overflow:hidden;position:relative;
  border:2.5px solid var(--mid2);box-shadow:0 10px 26px rgba(0,0,0,.42);
  background:#08110f;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.fighter.enemy .portrait{border-color:#7a4f6e}
.fighter.enemy .portrait::after{
  content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(155,93,229,.22);
}
.portrait.hit{animation:shake .32s}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-7px,2px) rotate(-2deg)}
  50%{transform:translate(6px,-3px) rotate(2deg)}
  80%{transform:translate(-3px,1px)}
}
.hpwrap{width:min(230px,100%);height:19px;border-radius:999px;background:#08110f;
  border:1.5px solid #24443c;overflow:hidden;position:relative}
.hpfill{height:100%;width:100%;transition:width .3s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#5eead4,#6ee7b7)}
.hpfill.foe{background:linear-gradient(90deg,#ff8b7b,#ffb4dc)}
.hptext{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;
  font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.4px}
.fname{font-weight:900;font-size:14px;color:var(--cream);text-align:center}
.fspecies{font-size:11px;color:#7fae9e;font-style:italic}
.status{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:22px}
.st{font-size:10.5px;font-weight:900;border-radius:999px;padding:2px 8px}
.st.blk{background:rgba(120,220,255,.2);color:var(--cyan);border:1px solid rgba(120,220,255,.5)}
.st.thr{background:rgba(255,180,220,.18);color:var(--pink);border:1px solid rgba(255,180,220,.45)}
.st.psn{background:rgba(180,255,180,.16);color:#b4ffb4;border:1px solid rgba(180,255,180,.4)}
.st.shk{background:rgba(254,240,138,.18);color:var(--gold);border:1px solid rgba(254,240,138,.45)}
.intent{
  background:rgba(11,29,25,.85);border:1.5px solid var(--pink);color:var(--pink);
  border-radius:12px;padding:5px 12px;font-size:12.5px;font-weight:800;
  box-shadow:0 4px 14px rgba(255,180,220,.12);text-align:center;
}

/* 手牌 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.energy{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(94,234,212,.14);border:1.5px solid var(--teal);border-radius:999px;
  padding:7px 16px;font-weight:900;color:var(--mint);font-size:14px;
}
.piles{font-size:12.5px;color:#8fbfae}
.piles b{color:var(--cream)}
.log{
  text-align:center;font-size:12.5px;color:#9dc9bb;min-height:18px;margin:2px 0 10px;
  font-weight:600;
}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:222px;padding:4px}
.card{
  width:142px;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;
  background:var(--cream);border:1.5px solid #d8d2c2;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  transition:transform .14s,box-shadow .14s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-12px);box-shadow:0 18px 34px rgba(0,0,0,.42)}
.card.dead{opacity:.45;filter:grayscale(.65);cursor:not-allowed}
.card.dead:hover{transform:none;box-shadow:0 6px 18px rgba(0,0,0,.32)}
.card.hot{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,139,123,.4),0 8px 20px rgba(0,0,0,.35)}
.card .img{height:88px;background:#0b1d19;overflow:hidden;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .cost{
  position:absolute;top:6px;left:6px;width:25px;height:25px;border-radius:50%;
  background:linear-gradient(180deg,#b9f8dd,#5eead4);color:#0b1d19;
  display:grid;place-items:center;font-weight:900;font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);border:1.5px solid #0b1d19;
}
.card .body{padding:7px 8px 9px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:900;font-size:12.5px;color:#182b26;line-height:1.2}
.card .tp{
  font-size:9.5px;font-weight:900;border-radius:5px;padding:1px 6px;
  align-self:flex-start;letter-spacing:.3px;
}
.tp.bait{background:#ffe9b0;color:#6b4a00}
.tp.shell{background:#c8e8ff;color:#08415f}
.tp.pred{background:#ffd3cd;color:#7a1f12}
.tp.bird{background:#e6d6ff;color:#3f2071}
.tp.giant{background:#c6e4ff;color:#123a63}
.tp.plant{background:#d4f5c4;color:#22520d}
.card .ds{font-size:10.5px;line-height:1.35;color:#41524c;font-weight:600;flex:1}

/* 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(4,12,10,.86);backdrop-filter:blur(6px);
  display:none;place-items:center;padding:16px;z-index:80;overflow-y:auto;
}
.mask.on{display:grid}
.sheet{
  width:100%;max-width:860px;background:linear-gradient(180deg,#14302a,#0e241f);
  border:1.5px solid var(--line);border-radius:24px;padding:24px 20px;
  box-shadow:0 26px 70px rgba(0,0,0,.6);text-align:center;max-height:90vh;overflow-y:auto;
}
.sheet h2{margin:0 0 6px;font-size:20px;color:var(--cream)}
.sheet .lead{color:#9dc9bb;font-size:13.5px;margin:0 0 16px}
.picks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 20px}
.picks .card{width:150px}
.picks .card:hover{transform:translateY(-8px) scale(1.02)}
.notice{
  background:rgba(254,240,138,.1);border:1px solid rgba(254,240,138,.35);
  color:var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;
  font-weight:700;margin:0 0 12px;display:inline-block;
}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hide{display:none!important}
.imgfallback{
  width:100%;height:100%;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg,#14302a,#0b1d19);
}
@media(max-width:640px){
  .arena{grid-template-columns:1fr;gap:12px}
  .arena::after{display:none}
  .portrait{width:104px;height:104px}
  .card{width:124px}
  .card .img{height:76px}
  .hero p{font-size:13.5px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="pill">🐙 <b>墨仔</b></span>
    <span class="pill" id="ui-hp">❤️ <b>65/65</b></span>
    <span class="pill" id="ui-gold">🪙 <b>50</b></span>
    <span class="pill" id="ui-act">🌊 <b>第1幕</b></span>
    <div class="relics" id="ui-relics"></div>
    <button class="btn ghost sm" onclick="UI.openDeck()">🃏 牌库 <span id="ui-deckn">10</span></button>
    <button class="btn ghost sm" id="btn-mute" onclick="Audio.toggle()">🔊</button>
  </div>

  <!-- 标题 -->
  <div id="scr-title" class="hero">
    <div class="art"><img src="img/player.jpg" alt="拟态章鱼"></div>
    <h1>墨水与触手</h1>
    <div class="sub">DEEP SEA DECK</div>
    <p>你是拟态小章鱼 <b>墨仔</b>。深海头足类霸主们正在争夺领地——<br>
    用整片海洋的卡牌作战：0 费磷虾、带刺海胆、巨藻与珊瑚，<br>
    以小鱼为饵，放出吞噬一切的虎鲸与大白鲨。</p>
    <div class="tagrow">
      <span>三幕爬塔</span><span>27 种海洋卡牌</span><span>14 种头足类对手</span><span>食物链吞噬</span>
    </div>
    <div class="cta">
      <button class="btn" onclick="Game.newRun()">🌊 开始深海冒险</button>
    </div>
  </div>

  <!-- 地图 -->
  <div id="scr-map" class="mapbox hide">
    <h2 id="map-title">第 1 幕 · 浅海珊瑚礁</h2>
    <p class="hint" id="map-hint">点击高亮的站点继续前进 →</p>
    <div class="track" id="map-track"></div>
    <div class="mapfoot" id="map-foot"></div>
  </div>

  <!-- 战斗 -->
  <div id="scr-battle" class="hide">
    <div class="arena">
      <div class="fighter">
        <div class="status" id="p-status"></div>
        <div class="portrait" id="p-art"><img src="img/player.jpg" alt=""></div>
        <div class="hpwrap"><div class="hpfill" id="p-hpbar"></div><div class="hptext" id="p-hptext">65 / 65</div></div>
        <div class="fname">拟态小章鱼 · 墨仔</div>
        <div class="fspecies">Thaumoctopus mimicus</div>
      </div>
      <div class="fighter enemy">
        <div class="intent" id="e-intent">意图：—</div>
        <div class="status" id="e-status"></div>
        <div class="portrait" id="e-art"><img src="img/sepiella.jpg" alt=""></div>
        <div class="hpwrap"><div class="hpfill foe" id="e-hpbar"></div><div class="hptext" id="e-hptext">36 / 36</div></div>
        <div class="fname" id="e-name">曼氏无针乌贼</div>
        <div class="fspecies" id="e-species">Sepiella maindroni</div>
      </div>
    </div>

    <div class="log" id="log">战斗开始——出牌吧！</div>

    <div class="bar">
      <div class="energy" id="ui-energy">⚡ 洋流 3 / 3</div>
      <div class="piles">抽牌堆 <b id="ui-draw">0</b> · 弃牌堆 <b id="ui-discard">0</b></div>
      <button class="btn pink" onclick="Game.endTurn()">结束回合 ⏭</button>
    </div>

    <div class="hand" id="hand"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ 音效 ============ */
const Audio = {
  ctx:null, muted:false,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  beep(f1,f2,dur,type,vol){
    if(this.muted) return;
    this.ensure(); if(!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    g.gain.setValueAtTime(vol||0.09,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  card(){ this.beep(430,720,0.09,'sine',0.08); },
  hit(){ this.beep(190,60,0.15,'triangle',0.16); },
  eat(){ this.beep(150,420,0.13,'sawtooth',0.13); setTimeout(()=>this.beep(300,90,0.16,'sawtooth',0.11),90); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,f*1.01,0.16,'sine',0.1),i*90)); },
  heal(){ this.beep(520,880,0.18,'sine',0.09); },
  toggle(){
    this.muted=!this.muted; this.ensure(); if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume();
    document.getElementById('btn-mute').textContent=this.muted?'🔇':'🔊';
  }
};

/* ============ 卡牌库 ============ */
const CARDS = {
  krill:{n:'南极磷虾',c:0,t:'bait',img:'krill',d:'造成 3 点伤害，抽 1 张牌。可被吞噬。',
    f:g=>{g.hitEnemy(3);g.draw(1)}},
  sandworm:{n:'沙蚕',c:0,t:'bait',img:'sandworm',d:'获得 3 护甲，造成 2 点伤害。可被吞噬。',
    f:g=>{g.block(3);g.hitEnemy(2)}},
  searoach:{n:'海蟑螂',c:0,t:'bait',img:'searoach',d:'造成 4 点伤害。可被吞噬。',
    f:g=>{g.hitEnemy(4)}},
  barnacle:{n:'藤壶群',c:0,t:'bait',img:'barnacle',d:'获得 4 护甲。可被吞噬。',
    f:g=>{g.block(4)}},
  seabutterfly:{n:'海蝴蝶',c:0,t:'bait',img:'seabutterfly',d:'下回合额外 +1 洋流。可被吞噬。',
    f:g=>{g.s.nextEnergy+=1}},
  clownfish:{n:'小丑鱼',c:1,t:'bait',img:'clownfish',d:'造成 5 点伤害，抽 1 张牌。可被吞噬。',
    f:g=>{g.hitEnemy(5);g.draw(1)}},

  hermit:{n:'寄居蟹',c:1,t:'shell',img:'hermit',d:'获得 6 点护甲。',f:g=>{g.block(6)}},
  urchin:{n:'紫海胆',c:1,t:'shell',img:'urchin',d:'获得 5 护甲，获得 3 层荆棘（反伤）。',
    f:g=>{g.block(5);g.s.p.thorns+=3}},
  lobster:{n:'波士顿龙虾',c:1,t:'shell',img:'lobster',d:'造成 6 点伤害，获得 5 护甲。',
    f:g=>{g.hitEnemy(6);g.block(5)}},

/* ============ 游戏主逻辑 ============ */
const Game = {
  s:null,

  newRun(){
    Audio.card();
    this.s = {
      hp:65, maxHp:65, gold:50, act:1, idx:0, nodes:[],
      deck:['krill','krill','sandworm','hermit','hermit','clownfish','clownfish','shark','kelp','eel'],
      relics:['hook'],
      energy:3, maxEnergy:3, nextEnergy:0,
      drawPile:[], hand:[], discard:[], playedPredatorThisFight:false,
      p:{block:0,thorns:0,poison:0},
      e:{def:null,hp:0,maxHp:0,block:0,shock:0,poison:0,i:0},
      inBattle:false
    };
    this.buildMap(1);
    UI.show('scr-map');
    UI.top();
  },

  buildMap(act){
    const s=this.s; s.act=act; s.idx=0;
    const normal=Object.keys(FOES).filter(k=>FOES[k].act===act&&!FOES[k].elite&&!FOES[k].boss);
    const elite=Object.keys(FOES).find(k=>FOES[k].act===act&&FOES[k].elite);
    const boss=Object.keys(FOES).find(k=>FOES[k].act===act&&FOES[k].boss);
    const pick=()=>normal[(Math.random()*normal.length)|0];
    s.nodes=[
      {k:'fight',i:'⚔️',l:'遭遇战',foe:pick()},
      {k:'fight',i:'⚔️',l:'遭遇战',foe:pick()},
      {k:'shop',i:'🐚',l:'沉船商店'},
      {k:'elite',i:'💀',l:'精英头足',foe:elite},
      {k:'rest',i:'🪸',l:'珊瑚休息'},
      {k:'boss',i:'👑',l:FOES[boss].n,foe:boss}
    ];
    UI.map();
  },

  /* ---- 战斗 ---- */
  startFight(foeKey){
    const def=FOES[foeKey], s=this.s;
    s.e={def,hp:def.hp,maxHp:def.hp,block:0,shock:0,poison:0,i:0};
    s.p={block:this.hasRelic('vent')?8:0,thorns:0,poison:0};
    s.playedPredatorThisFight=false;
    s.nextEnergy=0;
    s.drawPile=shuffle([...s.deck]);
    s.hand=[]; s.discard=[];
    s.inBattle=true;
    UI.show('scr-battle');
    this.startTurn();
  },

  startTurn(){
    const s=this.s;
    s.maxEnergy=3+(this.hasRelic('rum')?1:0);
    s.energy=s.maxEnergy+s.nextEnergy;
    s.nextEnergy=0;
    s.p.block=0;
    this.draw(5);
    UI.log('你的回合 - 洋流 '+s.energy);
    UI.battle();
  },

  draw(n){
    const s=this.s;
    for(let i=0;i<n;i++){
      if(!s.drawPile.length){
        if(!s.discard.length) break;
        s.drawPile=shuffle(s.discard); s.discard=[];
      }
      if(s.hand.length<10) s.hand.push(s.drawPile.pop());
    }
  },

  toHand(id){ if(this.s.hand.length<10) this.s.hand.push(id); },

  hasRelic(id){ return this.s.relics.includes(id); },
  hitEnemy(n,pierce){
    const e=this.s.e;
    let d=n;
    if(!pierce&&e.block>0){ const a=Math.min(e.block,d); e.block-=a; d-=a; }
    if(d>0){ e.hp=Math.max(0,e.hp-d); Audio.hit(); UI.shake('e-art'); }
  },
  hurtPlayer(n){
    const s=this.s,p=s.p;
    let d=n;
    if(s.e.shock>0) d=Math.floor(d*0.75);
    if(p.block>0){ const a=Math.min(p.block,d); p.block-=a; d-=a; }
    if(d>0){ s.hp=Math.max(0,s.hp-d); Audio.hit(); UI.shake('p-art'); }
    if(p.thorns>0) this.hitEnemy(p.thorns);
  },
  block(n){ this.s.p.block+=n; },
  heal(n){ this.s.hp=Math.min(this.s.maxHp,this.s.hp+n); Audio.heal(); },

  playCard(handIdx){
    const s=this.s, id=s.hand[handIdx], card=CARDS[id];
    let cost=card.c;
    const baitIdx = card.eat ? s.hand.findIndex((x,i)=>i!==handIdx&&CARDS[x].t==='bait') : -1;
    if(card.eat && baitIdx>=0 && id==='orca') cost=Math.max(0,cost-1);
    if(s.energy<cost) return;

    s.energy-=cost;
    s.hand.splice(handIdx,1);
    s.discard.push(id);

    let ate=false;
    if(card.eat){
      const bi=s.hand.findIndex(x=>CARDS[x].t==='bait');
      if(bi>=0){
        const eaten=s.hand.splice(bi,1)[0];
        s.discard.push(eaten);
        ate=true;
        Audio.eat();
        UI.log('🦈 吞噬 · '+CARDS[eaten].n+' → 威力爆发！');
        if(this.hasRelic('sonar')) this.draw(1);
      } else Audio.card();
    } else Audio.card();

    if(card.t==='plant' && this.hasRelic('pearl')) this.heal(3);

    card.f(this,ate);

    if(card.t==='pred'&&!s.playedPredatorThisFight&&this.hasRelic('hook')){
      s.playedPredatorThisFight=true; this.hitEnemy(6);
    }
    if(card.c===0&&this.hasRelic('plastic')) this.hitEnemy(3);
    if(ate) UI.log('吞噬爆发！');

    UI.battle();
    this.checkEnd();
  },

  endTurn(){
    const s=this.s;
    while(s.hand.length) s.discard.push(s.hand.pop());

    // 敌方中毒
    if(s.e.poison>0){ s.e.hp=Math.max(0,s.e.hp-s.e.poison); s.e.poison--; if(this.checkEnd()) return; }

    // 敌人行动
    s.e.block=0;
    const it=s.e.def.it[s.e.i%s.e.def.it.length];
    let msg='';
    if(it.k==='atk'){ this.hurtPlayer(it.v); msg=it.t+' '+it.v; }
    else if(it.k==='blk'){ s.e.block+=it.v; msg=it.t+' +'+it.v+' 护甲'; }
    else if(it.k==='mix'){ this.hurtPlayer(it.a); s.e.block+=it.b; msg=it.t+' '+it.a+'/+'+it.b; }
    else if(it.k==='psn'){ s.p.poison+=it.v; msg=it.t+' +'+it.v; }
    else if(it.k==='heal'){ s.e.hp=Math.min(s.e.maxHp,s.e.hp+it.v); msg=it.t+' +'+it.v; }
    UI.log('对手：'+msg);

    if(s.e.shock>0) s.e.shock--;
    s.e.i++;

    // 玩家中毒
    if(s.p.poison>0){ s.hp=Math.max(0,s.hp-s.p.poison); s.p.poison--; }

    if(this.checkEnd()) return;
    this.startTurn();
  },

  checkEnd(){
    const s=this.s;
    if(s.hp<=0){ this.gameOver(false); return true; }
    if(s.e.hp<=0){
      Audio.win();
      if(this.hasRelic('tooth')){ s.maxHp+=4; s.hp+=4; }
      s.inBattle=false;
      const boss=!!s.e.def.boss;
      if(boss && s.act===3){ this.gameOver(true); return true; }
      this.reward(boss);
      return true;
    }
    return false;
  },

  /* ---- 奖励 / 节点 ---- */
  reward(isBoss){
    const s=this.s;
    const gold=isBoss?45:22;
    s.gold+=gold;
    let relicMsg='';
    if(isBoss){
      const avail=Object.keys(RELICS).filter(k=>!this.hasRelic(k));
      if(avail.length){
        const r=avail[(Math.random()*avail.length)|0];
        s.relics.push(r);
        relicMsg='<div class="notice">🎁 获得 Boss 遗物：'+RELICS[r].i+' '+RELICS[r].n+'</div>';
      }
    }
    const pool=Object.keys(CARDS);
    const picks=[0,1,2].map(()=>pool[(Math.random()*pool.length)|0]);
    UI.sheet(`
      <h2>🎉 击败了 ${s.e.def.n}</h2>
      <p class="lead">获得 <b style="color:#fef08a">${gold}</b> 金币 · 选 1 张卡牌加入牌库</p>
      ${relicMsg}
      <div class="picks" id="picks"></div>
      <button class="btn ghost" onclick="Game.advance(${isBoss})">跳过，继续前进 →</button>
    `);
    const box=document.getElementById('picks');
    picks.forEach(id=>{
      const el=UI.cardEl(id);
      el.onclick=()=>{ s.deck.push(id); Audio.card(); Game.advance(isBoss); };
      box.appendChild(el);
    });
  },

  advance(wasBoss){
    UI.closeSheet();
    const s=this.s;
    if(wasBoss) this.buildMap(s.act+1);
    else { s.idx++; UI.map(); }
    UI.show('scr-map'); UI.top();
  },

  enterNode(node){
    Audio.card();
    if(node.k==='fight'||node.k==='elite'||node.k==='boss') this.startFight(node.foe);
    else if(node.k==='rest') this.rest();
    else if(node.k==='shop') this.shop();
  },

  rest(){
    UI.sheet(`
      <h2>🪸 珊瑚休息站</h2>
      <p class="lead">在温暖的珊瑚丛中休整</p>
      <div class="row">
        <button class="btn" onclick="Game.heal(20);UI.closeSheet();Game.advance(false)">❤️ 恢复 20 点生命</button>
        <button class="btn pink" onclick="Game.s.maxHp+=6;Game.heal(6);UI.closeSheet();Game.advance(false)">💪 最大生命 +6</button>
      </div>
    `);
  },

  shop(){
    const s=this.s, pool=Object.keys(CARDS);
    const items=[0,1,2].map(()=>pool[(Math.random()*pool.length)|0]);
    UI.sheet(`
      <h2>🐚 沉船商店</h2>
      <p class="lead">当前金币：<b style="color:#fef08a">${s.gold}</b></p>
      <div class="picks" id="picks"></div>
      <button class="btn ghost" onclick="UI.closeSheet();Game.advance(false)">离开商店</button>
    `);
    const box=document.getElementById('picks');
    items.forEach(id=>{
      const price=25+CARDS[id].c*10;
      const el=UI.cardEl(id);
      const tag=document.createElement('div');
      tag.style.cssText='background:#fef08a;color:#3a2f00;font-weight:900;font-size:12px;text-align:center;padding:3px';
      tag.textContent='🪙 '+price;
      el.appendChild(tag);
      el.onclick=()=>{
        if(s.gold>=price){ s.gold-=price; s.deck.push(id); Audio.card(); el.style.opacity=.35; el.onclick=null; UI.top(); }
      };
      box.appendChild(el);
    });
  },

  gameOver(win){
    UI.sheet(win?`
      <h2 style="color:#fef08a">🏆 通关！深海霸主</h2>
      <p class="lead">拟态小章鱼墨仔击败了大王酸浆鱿，成为新的深海传奇。</p>
      <button class="btn" onclick="UI.closeSheet();Game.newRun()">再来一局</button>
    `:`
      <h2 style="color:#ff8b7b">💀 墨水耗尽</h2>
      <p class="lead">你在第 ${this.s.act} 幕倒下了。深海依然充满挑战。</p>
      <button class="btn" onclick="UI.closeSheet();Game.newRun()">重新挑战</button>
    `);
  }
};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ UI 渲染 ============ */
const UI = {
  show(id){
    ['scr-title','scr-map','scr-battle'].forEach(x=>{
      document.getElementById(x).classList.toggle('hide', x!==id);
    });
  },
  log(t){ document.getElementById('log').textContent=t; },
  shake(id){
    const el=document.getElementById(id);
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  },
  top(){
    const s=Game.s; if(!s) return;
    document.getElementById('ui-hp').innerHTML='❤️ <b>'+s.hp+'/'+s.maxHp+'</b>';
    document.getElementById('ui-gold').innerHTML='🪙 <b>'+s.gold+'</b>';
    document.getElementById('ui-act').innerHTML='🌊 <b>'+ACT_NAME[s.act]+'</b>';
    document.getElementById('ui-deckn').textContent=s.deck.length;
    document.getElementById('ui-relics').innerHTML=s.relics.map(id=>{
      const r=RELICS[id];
      return '<div class="relic" data-tip="'+r.n+'：'+r.d+'">'+r.i+'</div>';
    }).join('');
  },
  map(){
    const s=Game.s;
    document.getElementById('map-title').textContent=ACT_NAME[s.act];
    document.getElementById('map-hint').textContent='点击高亮的站点继续前进 →';
    const track=document.getElementById('map-track');
    track.innerHTML='';
    s.nodes.forEach((n,i)=>{
      const d=document.createElement('div');
      d.className='node'+(i<s.idx?' done':'')+(i===s.idx?' current':'');
      d.innerHTML='<div class="ico">'+n.i+'</div><div class="lbl">'+n.l+'</div>';
      if(i===s.idx) d.onclick=()=>Game.enterNode(n);
      track.appendChild(d);
    });
  },
  cardEl(id){
    const c=CARDS[id];
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`
      <div class="img"><img src="img/${c.img}.jpg" alt="${c.n}"><div class="cost">${c.c}</div></div>
      <div class="body">
        <div class="nm">${c.n}</div>
        <div class="tp ${c.t}">${TTYPE[c.t]}</div>
        <div class="ds">${c.d}</div>
      </div>`;
    return el;
  },
  battle(){
    const s=Game.s, e=s.e;
    document.getElementById('p-hpbar').style.width=(s.hp/s.maxHp*100)+'%';
    document.getElementById('p-hptext').textContent=s.hp+' / '+s.maxHp;
    document.getElementById('e-hpbar').style.width=(e.hp/e.maxHp*100)+'%';
    document.getElementById('e-hptext').textContent=e.hp+' / '+e.maxHp;
    document.getElementById('e-name').textContent=e.def.n;
    document.getElementById('e-species').textContent=e.def.s;
    document.getElementById('e-art').innerHTML='<img src="img/'+e.def.img+'.jpg" alt="">';
    document.getElementById('p-art').innerHTML='<img src="img/player.jpg" alt="">';

    const ps=[];
    if(s.p.block>0) ps.push('<span class="st blk">🛡 '+s.p.block+'</span>');
    if(s.p.thorns>0) ps.push('<span class="st thr">🌵 '+s.p.thorns+'</span>');
    if(s.p.poison>0) ps.push('<span class="st psn">☠ '+s.p.poison+'</span>');
    document.getElementById('p-status').innerHTML=ps.join('');

    const es=[];
    if(e.block>0) es.push('<span class="st blk">🛡 '+e.block+'</span>');
    if(e.shock>0) es.push('<span class="st shk">⚡ '+e.shock+'</span>');
    if(e.poison>0) es.push('<span class="st psn">☠ '+e.poison+'</span>');
    document.getElementById('e-status').innerHTML=es.join('');

    const it=e.def.it[e.i%e.def.it.length];
    document.getElementById('e-intent').textContent='意图：'+it.t;

    document.getElementById('ui-energy').textContent='⚡ 洋流 '+s.energy+' / '+s.maxEnergy;
    document.getElementById('ui-draw').textContent=s.drawPile.length;
    document.getElementById('ui-discard').textContent=s.discard.length;

    const hand=document.getElementById('hand');
    hand.innerHTML='';
    const hasBait=s.hand.some(x=>CARDS[x].t==='bait');
    s.hand.forEach((id,i)=>{
      const c=CARDS[id];
      let cost=c.c;
      const hot=c.eat&&hasBait;
      if(id==='orca'&&hot) cost=Math.max(0,cost-1);
      const el=this.cardEl(id);
      el.querySelector('.cost').textContent=cost;
      if(hot) el.classList.add('hot');
      if(s.energy<cost) el.classList.add('dead');
      else el.onclick=()=>Game.playCard(i);
      hand.appendChild(el);
    });
    this.top();
  },
  sheet(html){
    document.getElementById('sheet').innerHTML=html;
    document.getElementById('mask').classList.add('on');
  },
  closeSheet(){ document.getElementById('mask').classList.remove('on'); },
  openDeck(){
    const s=Game.s;
    if(!s){ return; }
    this.sheet('<h2>🃏 当前牌库（'+s.deck.length+' 张）</h2><div class="picks" id="picks"></div><button class="btn ghost" onclick="UI.closeSheet()">关闭</button>');
    const box=document.getElementById('picks');
    s.deck.forEach(id=>box.appendChild(this.cardEl(id)));
  }
};
</script>
</body>
</html>
