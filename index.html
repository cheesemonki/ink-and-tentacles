<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨水与触手 · 深海牌局</title>
<link rel="stylesheet" href="ui-polish.css">
<style>
:root{
  --deep:#0b1d19;--deep2:#0e241f;--deep3:#14302a;--mid:#31534b;--mid2:#3f6b60;--line:#567158;
  --mint:#a7f3d0;--teal:#5eead4;--teal2:#6ee7b7;--pale:#ccfbf1;--cream:#fefef8;
  --pink:#ffb4dc;--lav:#dcb4ff;--cyan:#78dcff;--purple:#9a84e6;--gold:#fef08a;--coral:#ff8b7b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#1b4238 0%,transparent 60%),
             radial-gradient(800px 500px at 90% 100%,#10312b 0%,transparent 55%),
             linear-gradient(180deg,#0b1d19,#0a1a17 60%,#081614);
  color:var(--pale);overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(167,243,208,.13) 1px,transparent 1px);
  background-size:26px 26px;opacity:.45}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:12px 14px 34px}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(20,48,42,.86);
  border:1.5px solid var(--line);backdrop-filter:blur(10px);border-radius:16px;padding:8px 12px;
  margin-bottom:12px;box-shadow:0 8px 26px rgba(0,0,0,.28)}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(11,29,25,.72);
  border:1.5px solid var(--mid);color:var(--mint);border-radius:999px;padding:4px 12px;
  font-size:12.5px;font-weight:700;white-space:nowrap}
.pill b{color:var(--cream)}
.relics{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.relic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:rgba(94,234,212,.13);border:1.5px solid var(--teal);font-size:15px;cursor:help;position:relative}
.relic:hover::after{content:attr(data-tip);position:absolute;top:38px;right:0;width:200px;
  background:#0b1d19;border:1.5px solid var(--teal);color:var(--pale);padding:8px 10px;border-radius:10px;
  font-size:12px;line-height:1.45;z-index:99;font-weight:600}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;border-radius:999px;
  padding:9px 18px;font-size:14px;background:linear-gradient(180deg,var(--teal2),var(--teal));
  color:#0b1d19;transition:transform .12s,filter .12s;box-shadow:0 4px 14px rgba(94,234,212,.24)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mint);box-shadow:none}
.btn.pink{background:linear-gradient(180deg,#ffc6e3,var(--pink));color:#3d1130}
.btn.gold{background:linear-gradient(180deg,#fff7b8,var(--gold));color:#3a2f00}
.btn.lav{background:linear-gradient(180deg,#ecd9ff,var(--lav));color:#2f1a52}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:grayscale(.5);transform:none}

/* 标题 */
.hero{text-align:center;padding:30px 20px 28px;background:linear-gradient(180deg,rgba(20,48,42,.92),rgba(11,29,25,.94));
  border:1.5px solid var(--line);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.hero h1{margin:12px 0 4px;font-size:clamp(23px,4.4vw,38px);letter-spacing:1px;
  background:linear-gradient(180deg,#fff,#a7f3d0 70%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:#8fbfae;font-size:12px;letter-spacing:3px;margin-bottom:14px}
.hero p{color:#b9d9cf;line-height:1.85;font-size:14px;max-width:640px;margin:0 auto 6px}
.hero .art{width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden;border:3px solid var(--teal);
  box-shadow:0 0 0 8px rgba(94,234,212,.09),0 10px 30px rgba(0,0,0,.4);background:#08110f}
.hero .art img{width:100%;height:100%;object-fit:cover}
.tagrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px 0 2px}
.tagrow span{font-size:11.5px;padding:4px 11px;border-radius:999px;background:rgba(94,234,212,.1);
  border:1px solid rgba(94,234,212,.3);color:var(--mint)}
.cta{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn{font-size:16px;padding:13px 32px}

/* 角色选择 */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.charpick{background:linear-gradient(180deg,rgba(20,48,42,.95),rgba(11,29,25,.95));
  border:2px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;transition:.18s;text-align:center}
.charpick:hover{border-color:var(--teal);transform:translateY(-4px);box-shadow:0 14px 34px rgba(94,234,212,.18)}
.charpick .face{width:92px;height:92px;border-radius:50%;overflow:hidden;margin:0 auto 10px;
  border:2.5px solid var(--teal);background:#08110f}
.charpick .face img{width:100%;height:100%;object-fit:cover}
.charpick h3{margin:0 0 2px;font-size:16px;color:var(--cream)}
.charpick .sp{font-size:11px;color:#7fae9e;font-style:italic;margin-bottom:8px}
.charpick .sk{font-size:12px;color:var(--gold);font-weight:700;line-height:1.5;margin-bottom:6px}
.charpick .hp{font-size:11.5px;color:#9dc9bb}

/* 地图 */
.mapbox{background:rgba(14,36,31,.86);border:1.5px solid var(--line);border-radius:22px;padding:20px 18px;
  box-shadow:0 14px 40px rgba(0,0,0,.32)}
.mapbox h2{margin:0 0 3px;font-size:18px;color:var(--cream)}
.mapbox .hint{color:#8fbfae;font-size:12.5px;margin:0 0 16px}
.track{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.node{flex:1 0 104px;min-width:104px;border-radius:16px;padding:11px 7px;background:rgba(11,29,25,.6);
  border:1.5px solid #2b4a42;display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.4;transition:.18s}
.node .ico{font-size:22px;line-height:1}
.node .lbl{font-size:11px;font-weight:800;color:var(--pale);text-align:center;line-height:1.25}
.node.done{opacity:.78;border-color:var(--mid2);background:rgba(49,83,75,.5)}
.node.done .lbl::after{content:" ✓";color:var(--teal)}
.node.current{opacity:1;border-color:var(--teal);
  background:linear-gradient(180deg,rgba(94,234,212,.2),rgba(11,29,25,.8));
  box-shadow:0 0 0 3px rgba(94,234,212,.14),0 10px 24px rgba(94,234,212,.12);
  transform:translateY(-3px);cursor:pointer}

/* 战斗 */
.arena{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end;
  background:linear-gradient(180deg,rgba(20,48,42,.72),rgba(11,29,25,.9));border:1.5px solid var(--line);
  border-radius:22px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.32);margin-bottom:10px;position:relative}
.arena::after{content:"";position:absolute;left:50%;top:14%;bottom:14%;width:1px;
  background:linear-gradient(180deg,transparent,rgba(86,113,88,.6),transparent)}
.fighter{display:flex;flex-direction:column;align-items:center;gap:8px}
.portrait{width:118px;height:118px;border-radius:20px;overflow:hidden;position:relative;
  border:2.5px solid var(--mid2);box-shadow:0 10px 26px rgba(0,0,0,.42);background:#08110f}
.portrait img{width:100%;height:100%;object-fit:cover}
.fighter.enemy .portrait{border-color:#7a4f6e;box-shadow:inset 0 0 40px rgba(155,93,229,.22),0 10px 26px rgba(0,0,0,.42)}
.portrait.hit{animation:shake .32s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,2px) rotate(-2deg)}
  50%{transform:translate(6px,-3px) rotate(2deg)}80%{transform:translate(-3px,1px)}}
.hpwrap{width:min(230px,100%);height:18px;border-radius:999px;background:#08110f;
  border:1.5px solid #24443c;overflow:hidden;position:relative}
.hpfill{height:100%;transition:width .3s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#5eead4,#6ee7b7)}
.hpfill.foe{background:linear-gradient(90deg,#ff8b7b,#ffb4dc)}
.hptext{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.fname{font-weight:900;font-size:13.5px;color:var(--cream);text-align:center}
.fspecies{font-size:10.5px;color:#7fae9e;font-style:italic}
.status{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.st{font-size:10px;font-weight:900;border-radius:999px;padding:2px 7px}
.st.blk{background:rgba(120,220,255,.2);color:var(--cyan);border:1px solid rgba(120,220,255,.5)}
.st.thr{background:rgba(255,180,220,.18);color:var(--pink);border:1px solid rgba(255,180,220,.45)}
.st.psn{background:rgba(180,255,180,.16);color:#b4ffb4;border:1px solid rgba(180,255,180,.4)}
.st.shk{background:rgba(254,240,138,.18);color:var(--gold);border:1px solid rgba(254,240,138,.45)}
.st.vln{background:rgba(255,139,123,.18);color:var(--coral);border:1px solid rgba(255,139,123,.45)}
.st.frz{background:rgba(190,230,255,.18);color:#bfe6ff;border:1px solid rgba(190,230,255,.45)}
.st.buff{background:rgba(167,243,208,.16);color:var(--mint);border:1px solid rgba(167,243,208,.4)}
.intent{background:rgba(11,29,25,.85);border:1.5px solid var(--pink);color:var(--pink);border-radius:12px;
  padding:4px 11px;font-size:12px;font-weight:800;box-shadow:0 4px 14px rgba(255,180,220,.12);text-align:center}

/* 技能 */
.skillrow{display:flex;justify-content:center;margin:0 0 8px}
.skillbtn{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#2b5f52,#1b3f37);
  border:1.5px solid var(--teal);border-radius:14px;padding:7px 14px;cursor:pointer;transition:.15s;color:var(--pale)}
.skillbtn:hover{border-color:var(--mint);box-shadow:0 0 0 3px rgba(94,234,212,.12)}
.skillbtn.off{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.skillbtn .snm{font-weight:900;font-size:12.5px;color:var(--mint)}
.skillbtn .sds{font-size:11px;color:#9dc9bb}
.skillbtn .cd{background:rgba(11,29,25,.7);border-radius:999px;padding:2px 8px;font-size:11px;
  font-weight:900;color:var(--gold)}

/* 手牌 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.energy{display:inline-flex;align-items:center;gap:7px;background:rgba(94,234,212,.14);
  border:1.5px solid var(--teal);border-radius:999px;padding:6px 15px;font-weight:900;color:var(--mint);font-size:13.5px}
.piles{font-size:12px;color:#8fbfae}
.piles b{color:var(--cream)}
.log{text-align:center;font-size:12.5px;color:#9dc9bb;min-height:18px;margin:2px 0 8px;font-weight:600}
.hand{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:228px;padding:4px}

/* 卡牌（图片铺满 + 底部渐变文字区） */
.card{
  width:150px;height:214px;border-radius:15px;overflow:hidden;position:relative;cursor:pointer;
  background:#0a1a16;border:2px solid #2c4a42;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.25),box-shadow .16s,border-color .16s;
  transform-origin:50% 100%;
  display:flex;flex-direction:column;
}
.card .art{position:absolute;inset:0;overflow:hidden;background:#08110f}
.card .art img[hidden]{display:none}
.card .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .art img{transform:scale(1.07)}
.card .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(135deg,#1d4238,#0b1d19)}
.card .grad{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,14,12,.6) 0%,rgba(5,14,12,0) 22%),
             linear-gradient(0deg,rgba(5,14,12,.97) 30%,rgba(5,14,12,.82) 46%,rgba(5,14,12,0) 68%)}
.card .cost{position:absolute;top:6px;left:6px;width:25px;height:25px;border-radius:50%;
  background:linear-gradient(180deg,#d4fff0,#5eead4);color:#06231d;display:grid;place-items:center;
  font-weight:900;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.6),inset 0 -1px 0 rgba(0,0,0,.2);
  border:1.5px solid rgba(6,35,29,.85);z-index:3}
.card .gem{position:absolute;top:9px;right:9px;width:8px;height:8px;transform:rotate(45deg);z-index:3;
  border:1px solid rgba(0,0,0,.55);box-shadow:0 0 6px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;inset:5px;border-radius:10px;pointer-events:none;z-index:4;
  border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.card .panel{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 9px 9px;
  background:linear-gradient(0deg,rgba(5,14,12,.985) 0%,rgba(5,14,12,.95) 52%,rgba(5,14,12,.72) 78%,rgba(5,14,12,0) 100%)}
.card .nm{font-size:12.5px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:5px;
  text-shadow:0 1px 5px rgba(0,0,0,.95);letter-spacing:.2px;padding-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.13)}
.card .txt{font-size:10.3px;line-height:1.45;color:#cfe8df;font-weight:600;display:block}
.card .txt .k{color:#8ef0d0;font-weight:900}
.card.dead{filter:grayscale(.75) brightness(.62)}
.card.dead:hover{transform:none;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.card:hover{transform:translateY(-22px) scale(1.26);z-index:70;border-color:#7ef0c9;
  box-shadow:0 26px 50px rgba(0,0,0,.62),0 0 0 2px rgba(126,240,201,.35)}
.hand .card:hover{transform:translateY(-30px) scale(1.3)}
/* 所有手牌共用同一个激活标记。 */
.card .activation-mark{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:5;
  width:17px;height:17px;border-radius:50%;border:1px solid #bdc9c5;
  background:rgba(8,20,17,.9);display:grid;place-items:center;
}
.card[data-activation="active"] .activation-mark{
  border-color:#9bf5da;background:#163e35;box-shadow:0 0 7px rgba(155,245,218,.55);
}
.card[data-activation="active"] .activation-mark::after{
  content:"";width:7px;height:7px;border-radius:50%;background:#c4ffed;
}
.hand .card[data-activation="active"]{
  outline:1px solid rgba(155,245,218,.84);outline-offset:1px;
  box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 11px rgba(155,245,218,.42);
}
.hand .card[data-activation="active"]::after{
  border-color:rgba(155,245,218,.65);
}
.hand .card[data-activation="active"]:hover{
  box-shadow:0 26px 50px rgba(0,0,0,.62),0 0 13px rgba(155,245,218,.5);
}
@media (prefers-reduced-motion:reduce){
  .hand .card,.hand .card .art img{transition:none}
}

.r-common{border-color:#3a5e55}
.r-uncommon{border-color:#4aa7c9;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 14px rgba(120,220,255,.14)}
.r-rare{border-color:#9b6fe0;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 16px rgba(220,180,255,.22)}
.r-legend{border-color:#e8c94a;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 20px rgba(254,240,138,.3)}
.r-common .gem{background:#7f9c92}
.r-uncommon .gem{background:#78dcff}
.r-rare .gem{background:#dcb4ff}
.r-legend .gem{background:#fef08a;box-shadow:0 0 10px #fef08a}

/* 关键词浮窗 */
.kwpanel{position:fixed;z-index:200;max-width:262px;background:rgba(8,22,19,.97);
  border:1.5px solid #3f7a68;border-radius:14px;padding:11px 13px;display:none;
  box-shadow:0 18px 44px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.kwpanel.on{display:block}
.kwpanel .kwh{font-size:11px;color:#6f9c8c;letter-spacing:2px;margin-bottom:7px;font-weight:800}
.kwpanel .kwi{margin-bottom:7px}
.kwpanel .kwi:last-child{margin-bottom:0}
.kwpanel .kwn{font-size:12.5px;font-weight:900;color:#8ef0d0;margin-bottom:1px}
.kwpanel .kwd{font-size:11.5px;line-height:1.5;color:#b9d9cf;font-weight:600}

/* 图鉴筛选 */
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 14px}
.chip{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;cursor:pointer;
  background:rgba(11,29,25,.8);border:1.5px solid #2f5a4e;color:#9dc9bb;transition:.14s}
.chip:hover{border-color:#5eead4;color:#ccfbf1}
.chip.on{background:rgba(94,234,212,.18);border-color:#5eead4;color:#a7f3d0}
.distbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.distbar div{height:100%}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(4,12,10,.86);backdrop-filter:blur(6px);display:none;
  place-items:center;padding:16px;z-index:80;overflow-y:auto}
.mask.on{display:grid}
.sheet{width:100%;max-width:900px;background:linear-gradient(180deg,#14302a,#0e241f);
  border:1.5px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:0 26px 70px rgba(0,0,0,.6);
  text-align:center;max-height:90vh;overflow-y:auto}
.sheet h2{margin:0 0 5px;font-size:19px;color:var(--cream)}
.sheet .lead{color:#9dc9bb;font-size:13px;margin:0 0 14px}
.picks{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.picks .card{width:152px}
.picks .card:hover{transform:translateY(-8px) scale(1.02)}
.notice{background:rgba(254,240,138,.1);border:1px solid rgba(254,240,138,.35);color:var(--gold);
  border-radius:12px;padding:7px 12px;font-size:12.5px;font-weight:700;margin:0 0 10px;display:inline-block}
.row{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
.hide{display:none!important}
.help{font-size:12px;color:#8fbfae;line-height:1.7;text-align:left;background:rgba(11,29,25,.5);
  border-radius:14px;padding:12px 14px;margin:12px 0}
.help b{color:var(--mint)}
@media(max-width:680px){
  .arena{grid-template-columns:1fr;gap:10px}.arena::after{display:none}
  .portrait{width:96px;height:96px}.card{width:128px}.card .img{height:72px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="pill" id="ui-char">🐙 <b>—</b></span>
    <span class="pill" id="ui-hp">❤️ <b>65/65</b></span>
    <span class="pill" id="ui-gold">🪙 <b>50</b></span>
    <span class="pill" id="ui-act">🌊 <b>第1幕</b></span>
    <div class="relics" id="ui-relics"></div>
    <button class="btn ghost sm" onclick="UI.openDeck()">🃏 牌库 <span id="ui-deckn">10</span></button>
    <button class="btn ghost sm" onclick="UI.openCodex()">📖 图鉴</button>
    <button class="btn ghost sm" id="btn-mute" onclick="Audio.toggle()">🔊</button>
  </div>

  <div id="scr-title" class="hero">
    <div class="art"><img src="img/dumbo.jpg" alt="小飞象章鱼" onerror="this.src='img/player.jpg'"></div>
    <h1>墨水与触手</h1>
    <div class="sub">DEEP SEA DECK</div>
    <p>深海头足类霸主们正在争夺领地。<br>选择你的章鱼，用整片海洋的卡牌组出属于你的流派。</p>
    <div class="tagrow">
      <span>36 大流派</span><span>360 张卡牌</span><span>4 级稀有度</span><span>14 种头足类对手</span><span>角色专属技能</span>
    </div>
    <div class="cta" style="margin-top:16px"><button class="btn ghost" onclick="UI.openCodex()">📖 卡牌图鉴（360 张）</button></div>
    <div class="chars" id="char-list"></div>
  </div>

  <div id="scr-map" class="mapbox hide">
    <h2 id="map-title">第 1 幕</h2>
    <p class="hint">点击高亮的站点继续前进 →</p>

/* ================= 音效 ================= */
const Audio={ctx:null,muted:false,
  ensure(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}},
  beep(f1,f2,d,type,v){if(this.muted)return;this.ensure();if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);
    g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+.02)},
  card(){this.beep(430,720,.09,'sine',.07)},
  hit(){this.beep(190,60,.15,'triangle',.14)},
  eat(){this.beep(150,420,.12,'sawtooth',.12);setTimeout(()=>this.beep(300,90,.15,'sawtooth',.1),85)},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,f*1.01,.16,'sine',.09),i*85))},
  heal(){this.beep(520,880,.17,'sine',.08)},
  skill(){this.beep(700,1200,.15,'sine',.09)},
  toggle(){this.muted=!this.muted;this.ensure();
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    document.getElementById('btn-mute').textContent=this.muted?'🔇':'🔊'}
};

 '易伤':'易伤：受到的伤害 +25%/层，回合结束减 1 层。',

 '手牌':'手牌：当前可打出的牌，上限 10 张。',
 '生命':'生命：降到 0 则本局失败。'
};
function kwMark(text){
  let out=text;
  Object.keys(KW).forEach(k=>{
    out=out.split(k).join('<span class="k">'+k+'</span>');
  });
  return out;
}
function kwIn(text){
  return Object.keys(KW).filter(k=>text.indexOf(k)>=0);
}

/* ================= 游戏主逻辑 ================= */
const Game={
  s:null,
  newRun(charKey){
    Audio.card();
    const ch=CHARS[charKey]||CHARS.dumbo;
    this.s={
      ch, hp:ch.hp, maxHp:ch.hp, gold:50, act:1, idx:0, nodes:[],
      deck:[...ch.deck], relics:ch.relic?[ch.relic]:[],
      energy:3, maxEnergy:3, nextEnergy:0,
      drawPile:[], hand:[], discard:[],
      p:{block:0,thorns:0,poison:0},
      e:{def:null,hp:0,maxHp:0,block:0,shock:0,poison:0,freeze:0,vuln:0,i:0},
      buffs:{swarm:0,glow:0,growth:0},
      ateCount:0, keepBlock:false, costDown:0, fog:0, skipEnemy:false,
      tide:false, paralyze:0, voltPower:false, frozenHalf:false,
      growthBlock:false, tideBonus:0, skillCd:0, playedPredator:false,
      lastPlayed:[], turnNo:0, inBattle:false
    };
    this.buildMap(1);
    UI.show('scr-map'); UI.top();
  },

  buildMap(act){
    const s=this.s; s.act=act; s.idx=0;
    const normal=Object.keys(FOES).filter(k=>FOES[k].act===act&&!FOES[k].elite&&!FOES[k].boss);
    const elite=Object.keys(FOES).find(k=>FOES[k].act===act&&FOES[k].elite);
    const boss=Object.keys(FOES).find(k=>FOES[k].act===act&&FOES[k].boss);
    const pick=()=>normal[(Math.random()*normal.length)|0];
    s.nodes=[
      {k:'fight',i:'⚔️',l:'遭遇战',foe:pick()},
      {k:'fight',i:'⚔️',l:'遭遇战',foe:pick()},
      {k:'shop',i:'🐚',l:'沉船商店'},
      {k:'elite',i:'💀',l:'精英头足',foe:elite},
      {k:'rest',i:'🪸',l:'珊瑚休息'},
      {k:'boss',i:'👑',l:FOES[boss].n,foe:boss}
    ];
    UI.map();
  },

  /* --- 战斗生命周期 --- */
  startFight(foeKey){
    const def=FOES[foeKey], s=this.s;
    s.e={def,hp:def.hp,maxHp:def.hp,block:0,shock:0,poison:0,freeze:0,vuln:0,i:0};
    s.p={block:this.hasRelic('vent')?8:0,thorns:0,poison:0};
    s.buffs={swarm:0,glow:0,growth:0};
    s.ateCount=0; s.keepBlock=false; s.costDown=0; s.fog=0; s.skipEnemy=false;
    s.tide=false; s.paralyze=0; s.voltPower=false; s.frozenHalf=false;
    s.growthBlock=false; s.tideBonus=0; s.playedPredator=false; s.lastPlayed=[];
    s.turnNo=0;
    s.skillCd=0;
    if(this.hasRelic('ink')) s.e.shock+=3;
    this.initPoolFight();
    s.drawPile=shuffle(s.deck.map(id=>this.newToken(id))); s.hand=[]; s.discard=[];
    s.inBattle=true;
    UI.show('scr-battle');
    this.startTurn();
  },

  async startTurn(){
    const s=this.s;
    this.turnStarting=true;
    try{
      s.turnNo++;
      s.maxEnergy=3+(this.hasRelic('rum')?1:0)+(s.ch.skill.type==='passive'?1:0);
      s.energy=s.maxEnergy+s.nextEnergy;
      s.nextEnergy=0;
      s.p.block=s.turnNo===1?s.p.block:s.keepBlock?Math.min(8,s.p.block):0;
      s.keepBlock=false;
      if(this.hasRelic('shell')) s.p.block+=3;
      if(s.turnNo>1) s.p.block+=s.buffs.growth;
      s.costDown=0;
      await this.tickPool();
      if(this.checkEnd()) return;
      const draws=5+s.extraDraw;
      s.extraDraw=0;
      this.draw(draws);
      UI.log('回合 '+s.turnNo+' · 洋流 '+s.energy);
      UI.battle(); UI.top();
    } finally {
      this.turnStarting=false;
    }
  },

  draw(n){
    const s=this.s;
    for(let i=0;i<n&&s.hand.length<10;i++){
      if(!s.drawPile.length){
        if(!s.discard.length) break;
        s.drawPile=shuffle(s.discard); s.discard=[];
        if(this.hasRelic('lens')) s.hand.push(s.drawPile.pop());
      }
      if(s.hand.length<10&&s.drawPile.length) s.hand.push(s.drawPile.pop());
    }
  },

  /* --- 效果助手（供卡牌调用） --- */
  hasBait(){ return this.s.hand.some(id=>CARDS[id].baitBonus&&!CARDS[id].temporary); },

  handCardState(card,id=card.token){
    const eligible=this.s.hand.some(token=>token!==id&&!CARDS[token].temporary);
    const canDevour=Boolean(card.devours&&eligible);
    const cost=Math.max(0,(card.free?0:card.c)-(this.s.costDown>0?1:0)-Number(this.s.discounts.has(id)));
    const ctx={id,card,cost,paid:false};
    const conditional=Boolean(card.devours||card.activates);
    const active=canDevour||Boolean(card.activates?.(this,ctx));
    return {cost,canDevour,conditional,active};
  },
  heal(n){ const s=this.s; s.hp=Math.min(s.maxHp,s.hp+n); if(n>0)Audio.heal(); },
  gain(n){ this.s.energy+=n; },
  psn(n){ this.s.e.poison+=n; },
  shk(n){ this.s.e.shock+=n; },
  frz(n){ this.s.e.freeze+=n; },
  vln(n){ this.s.e.vuln+=n; },
  thr(n){ this.s.p.thorns+=n; },
  log(t){ UI.log(t); },

  addHand(id,n){ n=n||1; const s=this.s; for(let i=0;i<n;i++) if(s.hand.length<10) s.hand.push(id); },
  recall(){
    const s=this.s;
    if(!s.discard.length||s.hand.length>=10) return;
    const i=(Math.random()*s.discard.length)|0;
    const id=s.discard.splice(i,1)[0];
    if(s.hand.length<10) s.hand.push(id);
    UI.log('从弃牌堆取回 '+CARDS[id].n);
  },

  hasRelic(id){ return this.s.relics.includes(id); },

  /* --- 出牌 --- */
  async playCard(handIdx){
    const s=this.s;
    if(!s.inBattle||s.resolving||this.turnStarting) return;
    const id=s.hand[handIdx];
    if(!id) return;
    const card=CARDS[id];
    const {cost,canDevour}=this.handCardState(card,id);
    if(s.energy<cost) return;

    const ctx={id,card,cost,paid:true,ate:false,hidden:s.hidden.has(id),attack:false,defense:false};
    s.resolving=ctx;
    try{
      if(this.hasRelic('pearl2')&&!s._playedThisTurn){s._playedThisTurn=true;s.energy++;}
      s.energy-=cost;
      if(s.costDown>0) s.costDown--;
      s.hand.splice(handIdx,1);
      s.hidden.delete(id);
      s.discounts.delete(id);
      if(s.retain===id) s.retain=null;
      if(canDevour){
        const choices=s.hand.filter(token=>!CARDS[token].temporary);
        const eaten=await this.pickCard('吞噬一张手牌',choices);
        if(eaten){
          s.hand.splice(s.hand.indexOf(eaten),1);
          s.hidden.delete(eaten);
          if(s.retain===eaten) s.retain=null;
          s.discard.push(eaten);
          ctx.ate=true;
          Audio.eat();
          UI.log('🦈 吞噬 '+CARDS[eaten].n);
          ctx.passive=true;
          CARDS[eaten].baitBonus?.(this);
          if(this.hasRelic('sonar')&&s.e.hp>0) this.draw(1);
          if(this.hasRelic('fang')) this.hit(5,true);
          ctx.passive=false;
        }
      }
      if(!ctx.ate) Audio.card();
      if(s.e.hp>0){
        if(card.a==='symbio'&&this.hasRelic('pearl')) this.heal(3);
        await card.f(this,ctx);
      }
      s.attacked||=ctx.attack;
      s.defended||=ctx.defense;
      s.usedHidden||=ctx.hidden;
      if(!card.temporary){
        if(!s.sealed.has(id)) s.discard.push(id);
        s.lastPlayed.push(id);
        if(s.lastPlayed.length>6) s.lastPlayed.shift();
      }
      ctx.passive=true;
      if(card.devours&&!s.playedPredator&&this.hasRelic('hook')&&s.e.hp>0){
        s.playedPredator=true;
        this.hit(6);
      }
      if(card.c===0&&this.hasRelic('plastic')) this.hit(3);
    } finally {
      s.resolving=null;
    }
    if(!this.checkEnd()){UI.battle();UI.top();}
    else UI.top();
  },

  /* --- 技能 --- */
  useSkill(){
    const s=this.s, sk=s.ch.skill;
    if(!s.inBattle||s.resolving||this.turnStarting) return;
    if(sk.type==='passive'){ UI.log('被动技能始终生效'); return; }
    if(s.skillCd>0){ UI.log('技能冷却中（'+s.skillCd+'）'); return; }
    Audio.skill();
    if(s.ch.key==='mimic'){ this.mimicHandWithZero(); }
    else if(s.ch.key==='bluering'){ this.psn(3); UI.log('剧毒腺：施加 3 层剧毒'); }
    s.skillCd=sk.cd;
    UI.battle();
  },
  /* --- 回合结束 --- */
  endTurn(){
    const s=this.s;
    if(!s.inBattle||s.resolving||this.turnStarting) return;
    this.finishPoolTurn();
    s._playedThisTurn=false;
    if(this.checkEnd()) return;

    if(s.e.poison>0){
      s.e.hp=Math.max(0,s.e.hp-s.e.poison);
      UI.log('剧毒侵蚀 '+s.e.poison);
      s.e.poison--;
      if(this.checkEnd()) return;
    }

    s.e.block=0;
    if(s.skipEnemy){
      UI.log('对手被冻结，无法行动');
    } else {
      const it=s.e.def.it[s.e.i%s.e.def.it.length];
      let msg='';
      if(it.k==='atk'){ this.hurtPlayer(it.v); msg=it.t+' '+it.v; }
      else if(it.k==='blk'){ s.e.block+=it.v; msg=it.t+' +'+it.v+' 护甲'; }
      else if(it.k==='mix'){ this.hurtPlayer(it.a); s.e.block+=it.b; msg=it.t+' '+it.a+'/+'+it.b; }
      else if(it.k==='psn'){ s.p.poison+=it.v; msg=it.t+' +'+it.v; }
      else if(it.k==='heal'){ s.e.hp=Math.min(s.e.maxHp,s.e.hp+it.v); msg=it.t+' +'+it.v; }
      UI.log('对手：'+msg);
    }
    s.e.i++;
    s.skipEnemy=false;
    if(s.e.shock>0) s.e.shock--;
    if(s.e.vuln>0) s.e.vuln--;
    if(s.e.freeze>0) s.e.freeze--;

    if(s.p.poison>0){ s.hp=Math.max(0,s.hp-s.p.poison); s.p.poison--; }
    if(s.skillCd>0) s.skillCd--;

    if(this.checkEnd()) return;
    this.startTurn();
  },

  hurtPlayer(base){
    const s=this.s;
    let mult=1;
    if(s.e.shock>0) mult-=0.25;
    if(s.fog) mult-=s.fog/100;
    if(s.paralyze){mult*=0.5;s.paralyze=0;}
    if(s.frozenHalf) mult*=0.5;
    let d=Math.round(base*Math.max(0.15,mult));
    if(s.e.freeze>0) d=Math.max(0,d-2*s.e.freeze);
    let dd=d;
    if(s.p.block>0){ const a=Math.min(s.p.block,dd); s.p.block-=a; dd-=a; }
    if(dd>0){ s.hp=Math.max(0,s.hp-dd); Audio.hit(); UI.shake('p-art'); }
    if(s.p.thorns>0) this.hit(s.p.thorns);
  },

  checkEnd(){
    const s=this.s;
    if(s.hp<=0){ s.inBattle=false; this.gameOver(false); return true; }
    if(s.e.hp<=0){
      Audio.win();
      if(this.hasRelic('tooth')){ s.maxHp+=4; s.hp+=4; }
      s.inBattle=false;
      const boss=!!s.e.def.boss;
      if(boss&&s.act===3){ this.gameOver(true); return true; }
      this.reward(boss);
      return true;
    }
    return false;
  },

  /* --- 奖励 --- */
  /* --- 智能发牌：随牌库偏向同流派 --- */
  affinity(){
    const m={};
    (this.s?this.s.deck:[]).forEach(id=>{ const a=CARDS[id].a; m[a]=(m[a]||0)+1; });
    return m;
  },
  archMul(a){
    const n=this.affinity()[a]||0;
    return 1+Math.min(7,n*0.55);
  },
  cardWeight(id){
    const c=CARDS[id];
    let w=RAR[c.r].w*this.archMul(c.a);
    const dup=this.s?this.s.deck.filter(x=>x===id).length:0;
    if(dup>0) w*=1+Math.min(2.2,dup*0.28);
    return w;
  },
  pickWeighted(exclude,forceArch){
    const pool=Object.keys(CARDS).filter(id=>!exclude||!exclude.includes(id));
    let cand=forceArch?pool.filter(id=>CARDS[id].a===forceArch):pool;
    if(!cand.length) cand=pool;
    let total=0; const ws=cand.map(id=>{const w=this.cardWeight(id);total+=w;return w;});
    let r=Math.random()*total;
    for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0) return cand[i]; }
    return cand[cand.length-1];
  },
  topArch(){
    const m=this.affinity();
    let best=null,bv=0;
    Object.keys(m).forEach(k=>{ if(m[k]>bv){ bv=m[k]; best=k; } });
    return bv>=2?best:null;
  },
  draftPicks(n,force){
    const picks=[];
    const top=force?force:this.topArch();
    if(top && Math.random()<0.82) picks.push(this.pickWeighted(picks,top));
    let guard=0;
    while(picks.length<n&&guard++<80){ const id=this.pickWeighted(picks); if(id) picks.push(id); }
    return picks;
  },

  reward(isBoss){
    const s=this.s, gold=isBoss?45:22;
    s.gold+=gold;
    let relicMsg='';
    if(isBoss){
      const avail=Object.keys(RELICS).filter(k=>!this.hasRelic(k));
      if(avail.length){
        const r=avail[(Math.random()*avail.length)|0];
        s.relics.push(r);
        relicMsg='<div class="notice">🎁 获得 Boss 遗物：'+RELICS[r].i+' '+RELICS[r].n+'</div>';
      }
    }
    const picks=this.draftPicks(3);
    UI.sheet(`
      <h2>🎉 击败了 ${s.e.def.n}</h2>
      <p class="lead">获得 <b style="color:#fef08a">${gold}</b> 金币 · 选 1 张卡牌加入牌库</p>
      ${relicMsg}
      <div class="picks" id="picks"></div>
      <button class="btn ghost" onclick="Game.advance(${isBoss})">跳过，继续前进 →</button>
    `);
    const box=document.getElementById('picks');
    picks.forEach(id=>{
      const el=UI.cardEl(id);
      el.onclick=()=>{ s.deck.push(id); Audio.card(); Game.advance(isBoss); };
      box.appendChild(el);
    });
  },

  advance(wasBoss){
    UI.closeSheet();
    const s=this.s;
    if(wasBoss) this.buildMap(s.act+1); else { s.idx++; UI.map(); }
    UI.show('scr-map'); UI.top();
  },

  enterNode(node){
    Audio.card();
    if(node.k==='fight'||node.k==='elite'||node.k==='boss') this.startFight(node.foe);
    else if(node.k==='rest') this.rest();
    else if(node.k==='shop') this.shop();
  },

  rest(){
    UI.sheet(`
      <h2>🪸 珊瑚休息站</h2>
      <p class="lead">在温暖的珊瑚丛中休整</p>
      <div class="row">
        <button class="btn" onclick="Game.heal(20);UI.closeSheet();Game.advance(false)">❤️ 恢复 20 点生命</button>
        <button class="btn pink" onclick="Game.s.maxHp+=6;Game.heal(6);UI.closeSheet();Game.advance(false)">💪 最大生命 +6</button>
      </div>
    `);
  },

  shop(){
    const s=this.s;
    const items=this.draftPicks(3);
    UI.sheet(`
      <h2>🐚 沉船商店</h2>
      <p class="lead">当前金币：<b style="color:#fef08a">${s.gold}</b></p>
      <div class="picks" id="picks"></div>
      <button class="btn ghost" onclick="UI.closeSheet();Game.advance(false)">离开商店</button>
    `);
    const box=document.getElementById('picks');
    items.forEach(id=>{
      const price=24+CARDS[id].c*9;
      const el=UI.cardEl(id);
      const tag=document.createElement('div');
      tag.style.cssText='background:#fef08a;color:#3a2f00;font-weight:900;font-size:12px;text-align:center;padding:3px;border-radius:0 0 12px 12px';
      tag.textContent='🪙 '+price;
      el.appendChild(tag);
      el.onclick=()=>{
        if(s.gold>=price){ s.gold-=price; s.deck.push(id); Audio.card(); el.style.opacity=.35; el.onclick=null; UI.top(); }
      };
      box.appendChild(el);
    });
  },

  gameOver(win){
    UI.sheet(win?`
      <h2 style="color:#fef08a">🏆 通关！深海霸主</h2>
      <p class="lead">${this.s.ch.n} 击败了大王酸浆鱿，成为新的深海传奇。</p>
      <button class="btn" onclick="UI.closeSheet();UI.title()">换个角色再来</button>
    `:`
      <h2 style="color:#ff8b7b">💀 墨水耗尽</h2>
      <p class="lead">在第 ${this.s.act} 幕倒下了 · 打出了 ${this.s.turnNo} 个回合</p>
      <button class="btn" onclick="UI.closeSheet();UI.title()">重新挑战</button>
    `);
  }
};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= UI ================= */
const UI={
  show(id){ ['scr-title','scr-map','scr-battle'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id)); },
  log(t){ document.getElementById('log').textContent=t; },
  shake(id){ const el=document.getElementById(id); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); },

  title(){
    const box=document.getElementById('char-list');
    box.innerHTML='';
    Object.values(CHARS).forEach(ch=>{
      const el=document.createElement('div');
      el.className='charpick';
      el.innerHTML=`
        <div class="face"><img src="img/${ch.img}.jpg" alt="" onerror="this.src='img/player.jpg'"></div>
        <h3>${ch.n}</h3>
        <div class="sp">${ch.sp}</div>
        <div class="sk">✨ ${ch.skill.n} · ${ch.skill.d}</div>
        <div class="hp">❤️ ${ch.hp} 生命 · ${ch.desc}</div>`;
      el.onclick=()=>Game.newRun(ch.key);
      box.appendChild(el);
    });

  },

  top(){
    const s=Game.s; if(!s) return;
    document.getElementById('ui-char').innerHTML='🐙 <b>'+s.ch.n+'</b>';
    document.getElementById('ui-hp').innerHTML='❤️ <b>'+s.hp+'/'+s.maxHp+'</b>';
    document.getElementById('ui-gold').innerHTML='🪙 <b>'+s.gold+'</b>';
    document.getElementById('ui-act').innerHTML='🌊 <b>'+ACT_NAME[s.act]+'</b>';
    document.getElementById('ui-deckn').textContent=s.deck.length;
    document.getElementById('ui-relics').innerHTML=s.relics.map(id=>{
      const r=RELICS[id]; return '<div class="relic" data-tip="'+r.n+'：'+r.d+'">'+r.i+'</div>';
    }).join('');
  },

  map(){
    const s=Game.s;
    document.getElementById('map-title').textContent=ACT_NAME[s.act];
    const track=document.getElementById('map-track');
    track.innerHTML='';
    s.nodes.forEach((n,i)=>{
      const d=document.createElement('div');
      d.className='node'+(i<s.idx?' done':'')+(i===s.idx?' current':'');
      d.innerHTML='<div class="ico">'+n.i+'</div><div class="lbl">'+n.l+'</div>';
      if(i===s.idx) d.onclick=()=>Game.enterNode(n);
      track.appendChild(d);
    });
  },

  cardEl(id,opts){
    opts=opts||{};
    const c=CARDS[id];
    const el=document.createElement('div');
    const rc={c:'r-common',u:'r-uncommon',r:'r-rare',l:'r-legend'}[c.r];
    el.className='card '+rc+(opts.fixed?' fixed':'');
    el.dataset.card=c.id;
    if(c.species) el.dataset.species=c.species;
    el.innerHTML=`
      <div class="art">
        ${c.img?`<img src="img/${c.img}.jpg" alt="" onerror="this.hidden=true;this.nextElementSibling.style.display='grid'">`:''}
        <div class="fb" style="display:${c.img?'none':'grid'}">🐟</div>
      </div>
      <div class="grad"></div>
      <div class="cost">${c.c}</div>
      <div class="gem"></div>
      <div class="panel">
        <div class="nm" title="${c.species||c.n}">${c.n}</div>
        <div class="txt">${kwMark(c.d)}</div>
      </div>`;
    el.addEventListener('mouseenter',()=>UI.showKW(el,c));
    el.addEventListener('mouseleave',()=>UI.hideKW());
    return el;
  },

  battle(){
    const s=Game.s,e=s.e;
    document.getElementById('p-hpbar').style.width=Math.max(0,s.hp/s.maxHp*100)+'%';
    document.getElementById('p-hptext').textContent=s.hp+' / '+s.maxHp;
    document.getElementById('e-hpbar').style.width=Math.max(0,e.hp/e.maxHp*100)+'%';
    document.getElementById('e-hptext').textContent=e.hp+' / '+e.maxHp;
    document.getElementById('e-name').textContent=e.def.n;
    document.getElementById('e-species').textContent=e.def.s;
    document.getElementById('e-art').innerHTML='<img src="img/'+e.def.img+'.jpg" alt="" onerror="this.src=\'img/sepiella.jpg\'">';
    document.getElementById('p-art').innerHTML='<img src="img/'+s.ch.img+'.jpg" alt="" onerror="this.src=\'img/player.jpg\'">';
    document.getElementById('p-name').textContent=s.ch.n;
    document.getElementById('p-species').textContent=s.ch.sp;

    const ps=[];
    if(s.p.block>0) ps.push('<span class="st blk">🛡 '+s.p.block+'</span>');
    if(s.p.thorns>0) ps.push('<span class="st thr">🌵 '+s.p.thorns+'</span>');
    if(s.p.poison>0) ps.push('<span class="st psn">☠ '+s.p.poison+'</span>');
    if(s.buffs.echo>0) ps.push('<span class="st buff">回声 '+s.buffs.echo+'</span>');
    for(const item of s.delayed){
      const label={dive:'潜航',vent:'喷口',retain:'留牌'}[item.kind];
      ps.push('<span class="st buff">'+label+' · 第 '+item.turn+' 轮</span>');
    }
    if(s.buffs.swarm>0) ps.push('<span class="st buff">🐛 虫群 '+s.buffs.swarm+'</span>');
    if(s.buffs.glow>0) ps.push('<span class="st buff">✨ 发光 '+s.buffs.glow+'</span>');
    if(s.buffs.growth>0) ps.push('<span class="st buff">🌱 成长 '+s.buffs.growth+'</span>');
    ps.push('<span class="st shk">🌊 '+(s.tide?'涨潮':'退潮')+'</span>');
    document.getElementById('p-status').innerHTML=ps.join('');

    const es=[];
    if(e.block>0) es.push('<span class="st blk">🛡 '+e.block+'</span>');
    if(e.shock>0) es.push('<span class="st shk">⚡ '+e.shock+'</span>');
    if(e.poison>0) es.push('<span class="st psn">☠ '+e.poison+'</span>');
    if(e.vuln>0) es.push('<span class="st vln">💢 '+e.vuln+'</span>');
    if(e.freeze>0) es.push('<span class="st frz">❄ '+e.freeze+'</span>');
    document.getElementById('e-status').innerHTML=es.join('');

    const it=e.def.it[e.i%e.def.it.length];
    document.getElementById('e-intent').textContent='意图：'+it.t;

    const sk=s.ch.skill;
    document.getElementById('skill-name').textContent=sk.n;
    document.getElementById('skill-desc').textContent=sk.d;
    const btn=document.getElementById('skill-btn'), cd=document.getElementById('skill-cd');
    if(sk.type==='passive'){ cd.textContent='被动'; btn.classList.add('off'); btn.style.cursor='default'; }
    else if(s.skillCd>0){ cd.textContent='CD '+s.skillCd; btn.classList.add('off'); btn.style.cursor='not-allowed'; }
    else { cd.textContent='就绪'; btn.classList.remove('off'); btn.style.cursor='pointer'; }

    document.getElementById('ui-energy').textContent='⚡ 洋流 '+s.energy+' / '+s.maxEnergy;
    document.getElementById('ui-draw').textContent=s.drawPile.length;
    document.getElementById('ui-discard').textContent=s.discard.length;

    const hand=document.getElementById('hand');
    hand.innerHTML='';
    s.hand.forEach((id,i)=>{
      const {cost,conditional,active}=Game.handCardState(CARDS[id],id);
      const el=this.cardEl(id);
      const mark=document.createElement('span');
      const label=active?'已激活':conditional?'未激活':'无激活条件';
      el.dataset.activation=active?'active':'inactive';
      el.querySelector('.cost').textContent=cost;
      mark.className='activation-mark';
      if(s.hidden.has(id)) el.querySelector('.nm').title+=' · 伏藏';
      mark.title=label;
      mark.setAttribute('role','img');
      mark.setAttribute('aria-label',label);
      el.appendChild(mark);
      if(s.energy<cost) el.classList.add('dead');
      else el.onclick=()=>Game.playCard(i);
      hand.appendChild(el);
    });
  },

  sheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('mask').classList.add('on'); },
  closeSheet(){ document.getElementById('mask').classList.remove('on'); document.getElementById('sheet').innerHTML=''; },

  showKW(el,card){
    const keys=kwIn(card.d);
    const p=document.getElementById('kwpanel');
    if(!keys.length){ p.classList.remove('on'); return; }
    p.innerHTML='<div class="kwh">关键词</div>'+keys.map(k=>
      '<div class="kwi"><div class="kwn">'+k+'</div><div class="kwd">'+KW[k].replace(k,'').replace(/^：/,'')+'</div></div>'
    ).join('');
    p.classList.add('on');
    const r=el.getBoundingClientRect();
    const pw=262, ph=p.offsetHeight||160;
    let left, top;
    if(r.right + 14 + pw < window.innerWidth){
      left = r.right + 14; top = r.top + r.height/2 - ph/2;
    } else {
      left = r.left - 14 - pw; top = r.top + r.height/2 - ph/2;
    }
    top = Math.max(10, Math.min(top, window.innerHeight - ph - 10));
    left = Math.max(10, left);
    p.style.left=left+'px'; p.style.top=top+'px';
  },
  hideKW(){ document.getElementById('kwpanel').classList.remove('on'); },

  openCodex(){
    if(Game.uiChoice) return;
    this._cxArch='all'; this._cxRar='all';
    const n=Object.keys(CARDS).length;
    this.sheet(`
      <h2>📖 卡牌图鉴 <span style="font-size:12.5px;color:#8fbfae;font-weight:600">共 ${n} 张</span></h2>
      <p class="lead">鼠标移到卡牌上可查看关键词说明</p>
      <div class="filters" id="cx-arch"></div>
      <div class="filters" id="cx-rar"></div>
      <div class="picks" id="cx-list"></div>
      <button class="btn ghost" onclick="UI.closeSheet()">关闭</button>`);
    this._renderCodex();
  },
  _renderCodex(){
    const aBox=document.getElementById('cx-arch');
    const rBox=document.getElementById('cx-rar');
    const archs=[['all','全部流派']].concat(Object.keys(ARCH).map(k=>[k,ARCH[k].n]));
    const rars=[['all','全部稀有度'],['c','普通'],['u','精良'],['r','稀有'],['l','传说']];
    aBox.innerHTML=archs.map(([k,n])=>`<div class="chip ${this._cxArch===k?'on':''}" data-a="${k}">${n}</div>`).join('');
    rBox.innerHTML=rars.map(([k,n])=>`<div class="chip ${this._cxRar===k?'on':''}" data-r="${k}">${n}</div>`).join('');
    aBox.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{this._cxArch=el.dataset.a;this._renderCodex();});
    rBox.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{this._cxRar=el.dataset.r;this._renderCodex();});
    const list=document.getElementById('cx-list');
    list.innerHTML='';
    Object.keys(CARDS).filter(id=>{
      const c=CARDS[id];
      return (this._cxArch==='all'||c.a===this._cxArch)&&(this._cxRar==='all'||c.r===this._cxRar);
    }).forEach(id=>list.appendChild(this.cardEl(id,{fixed:true})));
  },
  openDeck(){
    if(Game.uiChoice) return;
    const s=Game.s; if(!s) return;
    const aff=Game.affinity();
    const total=s.deck.length||1;
    const order=Object.keys(aff).sort((a,b)=>aff[b]-aff[a]);
    const bar=order.map(k=>{
      const pct=aff[k]/total*100;
      return '<div style="width:'+pct+'%;background:'+ARCH[k].c+'" title="'+ARCH[k].n+'"></div>';
    }).join('');
    const legend=order.slice(0,5).map(k=>
      '<span style="font-size:11px;color:'+ARCH[k].c+';font-weight:800;margin:0 6px">'+ARCH[k].n+' '+aff[k]+'</span>').join('');
    this.sheet('<h2>🃏 当前牌库（'+s.deck.length+' 张）</h2>'+
      '<div class="distbar">'+bar+'</div><div style="margin-bottom:10px">'+legend+'</div>'+
      '<div class="picks" id="picks"></div><button class="btn ghost" onclick="UI.closeSheet()">关闭</button>');
    const box=document.getElementById('picks');
    s.deck.forEach(id=>box.appendChild(this.cardEl(id,{fixed:true})));
  }
};

UI.title();
</script>
